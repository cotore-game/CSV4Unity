name: Create Installer

on:
  workflow_call:
    inputs:
      version:
        description: 'Installer version'
        required: true
        type: string
      unity-artifact-name:
        description: 'Unity build artifact name to download'
        required: true
        type: string
      app-name:
        description: 'Application display name'
        required: false
        type: string
        default: 'My Game'
      app-exe-name:
        description: 'Executable filename without .exe'
        required: false
        type: string
        default: 'MyGame'
      app-id:
        description: 'Application ID for install directory and registry key'
        required: false
        type: string
        default: 'MyGame'
      app-publisher:
        description: 'Publisher name'
        required: false
        type: string
        default: 'your-org'
    outputs:
      installer-name:
        description: 'Installer filename'
        value: ${{ jobs.create-installer.outputs.installer-name }}

jobs:
  create-installer:
    name: Package with Inno Setup
    runs-on: windows-latest
    outputs:
      installer-name: ${{ steps.set-output.outputs.installer-name }}

    steps:
      # スクリプト・テンプレート取得のためにリポジトリをチェックアウト
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Unity Build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.unity-artifact-name }}
          path: build/StandaloneWindows64/

      - name: Cleanup Development-Only Folders
        shell: powershell
        run: |
          .github/scripts/cleanup-build.ps1 -BuildPath "build/StandaloneWindows64"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Generate Installer Script from Template
        shell: powershell
        env:
          APP_NAME: ${{ inputs.app-name }}
          APP_EXE_NAME: ${{ inputs.app-exe-name }}
          APP_ID: ${{ inputs.app-id }}
          APP_PUBLISHER: ${{ inputs.app-publisher }}
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          .github/scripts/generate-iss.ps1 `
            -Version "${{ inputs.version }}" `
            -RepoUrl "https://github.com/${{ github.repository }}" `
            -AppName "$env:APP_NAME" `
            -AppExeName "$env:APP_EXE_NAME" `
            -AppId "$env:APP_ID" `
            -AppPublisher "$env:APP_PUBLISHER"

      - name: Build Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-script.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Installer build complete"

      - name: Set Output
        id: set-output
        shell: bash
        run: |
          echo "installer-name=${{ inputs.app-exe-name }}-Setup-v${{ inputs.version }}.exe" >> $GITHUB_OUTPUT

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-v${{ inputs.version }}
          path: installer/
