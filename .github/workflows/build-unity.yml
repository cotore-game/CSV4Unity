name: Build Unity Project

on:
  workflow_call:
    inputs:
      version:
        description: 'Build version'
        required: true
        type: string
      targetPlatform:
        description: 'Target platform (StandaloneWindows64 / WebGL)'
        required: false
        type: string
        default: 'StandaloneWindows64'
      build-name:
        description: 'Unity build name (executable filename without .exe)'
        required: false
        type: string
        default: 'GameBuild'
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_LICENSE:
        required: true
    outputs:
      artifact-name:
        description: 'Uploaded build artifact name'
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build for ${{ inputs.targetPlatform }}
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-output.outputs.artifact-name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ inputs.targetPlatform }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: Library-${{ inputs.targetPlatform }}-

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          swap-storage: true
          dotnet: true

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          buildName: ${{ inputs.build-name }}
          targetPlatform: ${{ inputs.targetPlatform }}
          allowDirtyBuild: true

      - name: Set Output
        id: set-output
        run: |
          ARTIFACT_NAME="unity-build-${{ inputs.targetPlatform }}-${{ inputs.version }}"
          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Unity Build
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-${{ inputs.targetPlatform }}-${{ inputs.version }}
          path: build/${{ inputs.targetPlatform }}
