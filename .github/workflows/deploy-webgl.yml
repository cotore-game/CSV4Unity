name: Deploy WebGL to GitHub Pages

on:
  workflow_call:
    inputs:
      version:
        description: 'Build version (Optional, for logging)'
        required: false
        type: string
        default: ''
      unity-artifact-name:
        description: 'Unity build artifact name to download'
        required: true
        type: string
    outputs:
      page_url:
        description: 'Deployed GitHub Pages URL'
        value: ${{ jobs.deploy-webgl.outputs.page_url }}

jobs:
  deploy-webgl:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Unity Build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.unity-artifact-name }}
          path: build/WebGL

      - name: Locate WebGL Build Root
        id: locate
        run: |
          INDEX=$(find build/WebGL -name "index.html" | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "Error: index.html not found"
            find build/WebGL -type f | head -30
            exit 1
          fi
          BUILD_ROOT=$(dirname "$INDEX")
          echo "build_root=${BUILD_ROOT}" >> $GITHUB_OUTPUT
          echo "WebGL build root: ${BUILD_ROOT}"

      - name: Move WebGL Root to pages-root
        run: mv "${{ steps.locate.outputs.build_root }}" pages-root

      - name: Inject OGP Meta Tags
        run: |
          python3 .github/scripts/inject-ogp.py \
            --meta ".github/index/meta.yml" \
            --index "pages-root/index.html" \
            --assets ".github/index" \
            --out-dir "pages-root" \
            --repo-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
