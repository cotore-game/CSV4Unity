name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string
      build_windows:
        description: 'Build for Windows'
        required: true
        type: boolean
        default: true
      build_webgl:
        description: 'Build for WebGL'
        required: true
        type: boolean
        default: false
      create_release:
        description: 'Create GitHub Release (Windows build required)'
        required: true
        type: boolean
        default: true
      deploy_webgl:
        description: 'Deploy WebGL to GitHub Pages (WebGL build required)'
        required: true
        type: boolean
        default: false
      draft_release:
        description: 'Create as draft release'
        required: true
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  # ───────────────────────────────────────────────────
  # 初期化, プロジェクト設定読み込み
  # ───────────────────────────────────────────────────
  init:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      run_windows: ${{ steps.flags.outputs.run_windows }}
      run_webgl: ${{ steps.flags.outputs.run_webgl }}
      should_release: ${{ steps.flags.outputs.should_release }}
      should_deploy: ${{ steps.flags.outputs.should_deploy }}
      is_draft: ${{ steps.flags.outputs.is_draft }}
      is_prerelease: ${{ steps.flags.outputs.is_prerelease }}
      # .github/project.yml から読み込んだ値
      app_name: ${{ steps.config.outputs.app_name }}
      app_exe_name: ${{ steps.config.outputs.app_exe_name }}
      app_id: ${{ steps.config.outputs.app_id }}
      app_publisher: ${{ steps.config.outputs.app_publisher }}
      system_requirements: ${{ steps.config.outputs.system_requirements }}
      workflow_display_name: ${{ steps.config.outputs.workflow_display_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Project Config
        id: config
        run: |
          python3 << 'PYEOF'
          import os

          result = {}
          with open('.github/project.yml', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  if ':' not in line:
                      continue
                  key, _, val = line.partition(':')
                  val = val.strip().strip('"\'')
                  result[key.strip()] = val

          defaults = {
              'app_name': 'My Game',
              'app_exe_name': 'MyGame',
              'app_id': 'MyGame',
              'app_publisher': 'your-org',
              'system_requirements': 'Windows 10 / 11 (64-bit)',
              'workflow_display_name': 'My Game',
          }

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, default in defaults.items():
                  val = result.get(key, default)
                  out.write(f'{key}={val}\n')
                  print(f'  {key}: {val}')
          PYEOF

      - name: Resolve Version
        id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Resolve Flags
        id: flags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "run_windows=true" >> $GITHUB_OUTPUT
            echo "run_webgl=true" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "is_draft=false" >> $GITHUB_OUTPUT
            if [[ "${{ github.ref }}" =~ (beta|alpha|rc) ]]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "run_windows=${{ inputs.build_windows }}" >> $GITHUB_OUTPUT
            echo "run_webgl=${{ inputs.build_webgl }}" >> $GITHUB_OUTPUT
            echo "should_release=${{ inputs.create_release }}" >> $GITHUB_OUTPUT
            echo "should_deploy=${{ inputs.deploy_webgl }}" >> $GITHUB_OUTPUT
            echo "is_draft=${{ inputs.draft_release }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
          fi

  # ───────────────────────────────────────────────────
  # Unity ビルド（Windows）
  # ───────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    needs: init
    if: needs.init.outputs.run_windows == 'true'
    uses: ./.github/workflows/build-unity.yml
    with:
      version: ${{ needs.init.outputs.version }}
      targetPlatform: 'StandaloneWindows64'
      build-name: ${{ needs.init.outputs.app_exe_name }}
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

  # ───────────────────────────────────────────────────
  # Unity ビルド（WebGL）
  # ───────────────────────────────────────────────────
  build-webgl:
    name: Build (WebGL)
    needs: init
    if: needs.init.outputs.run_webgl == 'true'
    uses: ./.github/workflows/build-unity.yml
    with:
      version: ${{ needs.init.outputs.version }}
      targetPlatform: 'WebGL'
      build-name: ${{ needs.init.outputs.app_exe_name }}
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

  # ───────────────────────────────────────────────────
  # Inno Setup インストーラー作成
  # ───────────────────────────────────────────────────
  create-installer:
    name: Create Installer
    needs: [init, build-windows]
    if: needs.init.outputs.run_windows == 'true'
    uses: ./.github/workflows/create-installer.yml
    with:
      version: ${{ needs.init.outputs.version }}
      unity-artifact-name: ${{ needs.build-windows.outputs.artifact-name }}
      app-name: ${{ needs.init.outputs.app_name }}
      app-exe-name: ${{ needs.init.outputs.app_exe_name }}
      app-id: ${{ needs.init.outputs.app_id }}
      app-publisher: ${{ needs.init.outputs.app_publisher }}

  # ───────────────────────────────────────────────────
  # GitHub Release 作成
  # ───────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [init, build-windows, create-installer]
    if: |
      needs.init.outputs.should_release == 'true' &&
      needs.init.outputs.run_windows == 'true' &&
      needs.create-installer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Installer
        uses: actions/download-artifact@v4
        with:
          name: installer-v${{ needs.init.outputs.version }}
          path: release-assets/

      - name: Download Windows Build (ZIP用)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: build-windows/

      - name: Create ZIP Archive
        run: |
          cd build-windows
          zip -r "../release-assets/${{ needs.init.outputs.app_exe_name }}-v${{ needs.init.outputs.version }}-Windows.zip" .
          ls -lh ../release-assets/

      - name: Resolve Tag Name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${{ needs.init.outputs.version }}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "${{ needs.init.outputs.app_name }} ${{ steps.tag.outputs.tag_name }}"
          draft: ${{ needs.init.outputs.is_draft == 'true' }}
          prerelease: ${{ needs.init.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## ${{ needs.init.outputs.app_name }} ${{ steps.tag.outputs.tag_name }}

            ### インストール方法

            #### インストーラー版（推奨）
            1. `${{ needs.init.outputs.app_exe_name }}-Setup-v${{ needs.init.outputs.version }}.exe` をダウンロード
            2. ファイルを実行してウィザードに従ってインストール
            3. スタートメニューの「${{ needs.init.outputs.app_name }}」から起動

            #### ポータブル版（ZIP）
            1. `${{ needs.init.outputs.app_exe_name }}-v${{ needs.init.outputs.version }}-Windows.zip` をダウンロード
            2. 任意の場所に展開
            3. `${{ needs.init.outputs.app_exe_name }}.exe` を起動

            ### ビルド情報
            | 項目 | 値 |
            |------|-----|
            | バージョン | `${{ needs.init.outputs.version }}` |
            | ビルド番号 | `#${{ github.run_number }}` |
            | コミット | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |

            ### 🔧 システム要件
            - ${{ needs.init.outputs.system_requirements }}
          files: |
            release-assets/${{ needs.init.outputs.app_exe_name }}-Setup-v${{ needs.init.outputs.version }}.exe
            release-assets/${{ needs.init.outputs.app_exe_name }}-v${{ needs.init.outputs.version }}-Windows.zip

  # ───────────────────────────────────────────────────
  # WebGL → GitHub Pages デプロイ
  # ───────────────────────────────────────────────────
  deploy-webgl:
    name: Deploy to GitHub Pages
    needs: [init, build-webgl]
    if: |
      needs.init.outputs.should_deploy == 'true' &&
      needs.init.outputs.run_webgl == 'true' &&
      needs.build-webgl.result == 'success'
    uses: ./.github/workflows/deploy-webgl.yml
    with:
      version: ${{ needs.init.outputs.version }}
      unity-artifact-name: ${{ needs.build-webgl.outputs.artifact-name }}

  # ───────────────────────────────────────────────────
  # Discord 通知
  # ───────────────────────────────────────────────────
  notify-success:
    name: Notify Success
    needs: [init, build-windows, build-webgl, create-installer, release, deploy-webgl]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: "success"
      version: ${{ needs.init.outputs.version }}
      caller-run-id: ${{ github.run_id }}
      workflow-name: "${{ needs.init.outputs.workflow_display_name }}"
      job-name: "All processes completed successfully"
      installer-artifact-name: ${{ needs.init.outputs.run_windows == 'true' && format('installer-v{0}', needs.init.outputs.version) || '' }}
      windows-artifact-name: ${{ needs.build-windows.outputs.artifact-name }}
      webgl-artifact-name: ${{ needs.build-webgl.outputs.artifact-name }}
      pages-url: ${{ needs.deploy-webgl.outputs.page_url }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  notify-failure:
    name: Notify Failure
    needs: [init, build-windows, build-webgl, create-installer, release, deploy-webgl]
    if: |
      always() &&
      contains(needs.*.result, 'failure')
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: "failure"
      version: ${{ needs.init.outputs.version }}
      caller-run-id: ${{ github.run_id }}
      workflow-name: "${{ needs.init.outputs.workflow_display_name }}"
      job-name: "An error occurred"
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  notify-cancelled:
    name: Notify Cancelled
    needs: [init, build-windows, build-webgl, create-installer, release, deploy-webgl]
    if: |
      always() &&
      contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'failure')
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: "cancelled"
      version: ${{ needs.init.outputs.version }}
      caller-run-id: ${{ github.run_id }}
      workflow-name: "${{ needs.init.outputs.workflow_display_name }}"
      job-name: "Build was cancelled"
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
